<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    user-select: none;
    -webkit-app-region: drag;
  }
  .splash-card {
    background: transparent;
    border-radius: 20px;
    padding: 36px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .logo-img {
    width: 64px;
    height: 64px;
    opacity: 0.95;
    filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6));
  }
  .app-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #f1f5f9;
    text-shadow:
      0 0 2px rgba(0, 0, 0, 0.8),
      0 0 6px rgba(0, 0, 0, 0.5),
      0 1px 3px rgba(0, 0, 0, 0.6);
  }
  .spinner-box {
    margin: 2px 0;
  }
  .spinner {
    display: block;
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #progress-text {
    font-size: 13px;
    color: #e2e8f0;
    min-height: 20px;
    text-align: center;
    transition: opacity 0.25s;
    text-shadow:
      0 0 2px rgba(0, 0, 0, 0.8),
      0 0 6px rgba(0, 0, 0, 0.5),
      0 1px 2px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
<div class="splash-card">
  <img class="logo-img" src="../public/logo-128.png" alt="rdCLI" />
  <div class="app-title">rdCLI</div>
  <div class="spinner-box"><span class="spinner"></span></div>
  <div id="progress-text">正在启动…</div>
</div>
</body>
</html>
